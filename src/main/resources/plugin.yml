name: Xenon
version: '${version}'
main: dev.mix.xenon.XenonPlugin
description: Conservative Paper server performance controls for entity cleanup, mob caps, and controlled chunk pregeneration.
author: Mix
api-version: '26.3'
commands:
  xenon:
    description: View Xenon status and manage optimization features.
    usage: /xenon <status|report|pregen|cancel|reload|refreshmobs>
    aliases: [xenonoptimizer, xo]
permissions:
  xenon.admin:
    description: Manage Xenon settings and pregeneration.
    default: op
  xenon.status:
    description: View Xenon status and performance reports.
    default: true
